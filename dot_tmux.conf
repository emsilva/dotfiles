# ~/.tmux.conf — sane defaults, portable across hosts
# Prefix: C-Space   Reload: prefix r   Toggle mouse: prefix m   Copy mode: prefix [

# ── Prefix ────────────────────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Terminal & colors ─────────────────────────────────────────────────────────
# tmux-256color is the modern, correct outer-terminal value. If a remote host
# is missing the terminfo entry, run on that host:
#   infocmp -x tmux-256color > /tmp/ti && tic -x /tmp/ti
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-features ",xterm-kitty:RGB"
set -as terminal-features ",alacritty:RGB"
set -as terminal-features ",ghostty:RGB"
set -as terminal-features ",foot:RGB"
# Nested tmux: an inner tmux sees the outer's $TERM as tmux-256color, so it
# needs this line to know its "outer terminal" (the outer tmux) supports RGB.
set -as terminal-features ",tmux-256color:RGB"
# DECSET 2026 synchronized output — reduces flicker in Claude Code, neovim, etc.
# Requires tmux ≥ 3.4.
set -as terminal-features ",*:sync"
# focus-events on: forwards FocusIn/FocusOut to apps inside tmux. Claude
# Code, neovim's autoread, and others rely on this.
# Caveat: if your shell prompt redraws on focus loss it will retrigger
# monitor-activity and re-light the just-left window. Fix that at the shell
# (see ~/.zshrc: unbind \e[I / \e[O), not by turning this off.
set -g focus-events on

# OSC 52: let the outer terminal own the system clipboard, including over SSH.
# Pairs with kitty's default `clipboard_control` (write-clipboard, write-primary).
set -g set-clipboard on

# Allow DCS passthrough so kitty/ghostty graphics protocol, imgcat, and similar
# escape sequences survive tmux.
set -g allow-passthrough on

# ── Mouse ─────────────────────────────────────────────────────────────────────
# Wheel scrolls tmux's scrollback; click-drag selects into tmux's copy buffer.
# Hold Shift while selecting to bypass tmux and use the terminal's native
# selection (better for multi-line copy across panes).
#
# CAVEAT for Claude Code: with mouse on, tmux grabs scroll events before
# Claude's TUI sees them — Claude's own scrollbar won't work. Workarounds:
#   • `prefix [` then vi keys (k/j, C-u/C-d) to scroll inside Claude
#   • `prefix m` to toggle tmux mouse off when you want Claude's native scroll
set -g mouse on
bind m set -g mouse \; display "mouse: #{?mouse,on,off}"

# ── Sane behavior ─────────────────────────────────────────────────────────────
set -g history-limit 100000
set -sg escape-time 10               # snappy ESC in vim without losing legit escapes
set -g base-index 1                  # windows count from 1
setw -g pane-base-index 1
set -g renumber-windows on           # close window 2 → window 3 becomes 2
set -g aggressive-resize on          # resize per attached client, not the whole window
setw -g automatic-rename off         # don't auto-name windows from the running command
set -g allow-rename on               # but DO let apps (ssh, etc.) set window names explicitly
set -g detach-on-destroy on          # killing the last window in the current session detaches you back to the shell instead of jumping into another session
set -g set-titles on
set -g set-titles-string "tmux: #S · #W"
set -g display-time 2000
set -g status-interval 5

# Highlight backgrounded windows with the BELL only — not activity.
# Activity (any output) was useless here because Claude Code's TUI redraws on
# every focus change and during streaming, so the orange tab lit up constantly
# and meant nothing. The terminal bell, on the other hand, fires when Claude
# finishes responding (and from other "I want your attention" sources), so
# pink-red tabs = signal worth seeing.
setw -g monitor-activity off
setw -g monitor-bell on
set  -g visual-activity off
set  -g visual-bell off
set  -g bell-action other        # ring the bell from any window, not just current

# ── Copy mode: vim style ──────────────────────────────────────────────────────
setw -g mode-keys vi
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-selection-and-cancel
# After a mouse drag finishes, keep the selection visible instead of snapping to
# the bottom of the buffer.
unbind -T copy-mode-vi MouseDragEnd1Pane
bind   -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-no-clear

# ── Splits: intuitive keys, open in current directory ─────────────────────────
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window     -c "#{pane_current_path}"

# ── Vim-style pane navigation ─────────────────────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing — repeat-time means you can mash H/J/K/L after one prefix ──
bind -r H resize-pane -L 5
bind -r J resize-pane -D 3
bind -r K resize-pane -U 3
bind -r L resize-pane -R 5

# ── Pane zoom & layout ────────────────────────────────────────────────────────
# Z — "column zoom": toggle the current pane to full HEIGHT within its split,
# squishing its top/bottom siblings, then restore on the next press. Same toggle
# feel as the built-in `z`, but only on the vertical axis. It works by saving the
# whole window layout into @layout_save, maxing the pane (`resize-pane -y 100%`),
# then restoring + clearing that saved layout next time. The `tmux set -up` (not
# bare `set`) in the restore branch is what clears the flag — without it the
# toggle sticks. Caveat: closing a pane while zoomed leaves a stale saved layout;
# `prefix =` rebalances you out of it. Swap `-y` → `-x` for a horizontal version.
bind Z if -F '#{@layout_save}' \
    { run 'tmux select-layout "#{@layout_save}" ; tmux set -up @layout_save' } \
    { set -Fp @layout_save '#{window_layout}' ; run 'tmux resize-pane -y 100%' }
bind = select-layout -E       # rebalance — evens out just the panes in the current split group
bind z resize-pane -Z         # keep your existing full-screen zoom

# ── No-prefix Alt nav + Alt-Shift resize ──────────────────────────────────────
# Faster than prefix h/j/k/l once muscle memory kicks in. Caveat: takes those
# chords away from apps that use Alt-letter shortcuts (e.g. ranger, mc, some
# emacs modes). Comment out individual bindings if you hit conflicts.
#
# NOTE: M-h/j/k/l (nav) are now owned by vim-tmux-navigator (see Plugins below),
# which makes them vim-aware — one keystroke crosses into nvim splits and falls
# back to select-pane otherwise. They're set there via @vim_navigator_mapping_*,
# which is why they're no longer bound here.
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 3
bind -n M-K resize-pane -U 3
bind -n M-L resize-pane -R 5

# ── Sessions & windows ────────────────────────────────────────────────────────
# Zoomed pickers — the default `choose-tree` opens unzoomed and feels cramped.
bind s choose-tree -Zs
bind w choose-tree -Zw

# Move the current window left/right with repeat (mash < or > after one prefix).
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# `prefix l` is taken by select-pane -R (vim-style nav), so put "last window"
# on prefix Tab instead — flip between the two most recently used windows.
bind Tab last-window

# ── Reload config ─────────────────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"

# ── Scratch popup ─────────────────────────────────────────────────────────────
# F11 opens a centered floating shell over whatever's on screen. It attaches
# to a dedicated "scratch" session that persists between popups — anything
# you leave running (htop, a tail -f, a half-typed command, shell history)
# is still there next time you pop it open. Inside, `Ctrl-D` or `exit`
# closes the popup but the session lives on; `Ctrl-Space Ctrl-Space d` (the
# nested-prefix dance) detaches from the scratch session the same way.
# For a stateless one-shot popup instead, drop the `TMUX=… tmux attach…`
# command and tmux just opens a fresh default-shell.
bind -n F11 display-popup -E -w 80% -h 80% \
    -T " scratch " \
    -S "fg=#ab9df2" \
    "TMUX='' tmux attach -t scratch 2>/dev/null || TMUX='' tmux new -s scratch"

# ── Nested tmux: F12 passthrough toggle ───────────────────────────────────────
# When you ssh into a box that also runs tmux, the outer tmux (this one) eats
# your prefix before the inner sees it. Two ways to handle it:
#   1. Prefix-prefix:  Ctrl-Space Ctrl-Space <key> — sends prefix to the inner.
#   2. Passthrough:    F12 disables the outer's prefix entirely so every key
#                      (including Ctrl-Space) reaches the inner. F12 again
#                      restores it. Status bar darkens as a visual cue.
bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=#fcfcfa,bg=#403e41,bold" \;\
    if -F '#{pane_in_mode}' 'send-keys -X cancel' \;\
    refresh-client -S \;\
    display "F12: passthrough ON — keys reach the inner tmux"

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S \;\
    display "F12: passthrough OFF"

# ── Help / cheat sheet ────────────────────────────────────────────────────────
# `prefix ?` (built-in) lists EVERY binding tmux knows — useful for spelunking.
# `prefix /` opens a curated cheat sheet of the bindings you actually use,
# rendered with less inside a popup. Edit ~/.config/tmux/cheatsheet.sh when
# you change bindings to keep it in sync.
bind / display-popup -E -w 80% -h 90% \
    -T " tmux cheat sheet " \
    -S "fg=#ab9df2" \
    "~/.config/tmux/cheatsheet.sh | less -R"

# ── Status bar — Monokai Pro (matches ~/.config/kitty/theme.conf) ────────────
# Palette:
#   #ab9df2 purple  — accent (active session/window/border), like kitty's active tab
#   #fcfcfa white   — foreground
#   #939293 dim3    — primary status text
#   #727072 dim2    — inactive windows / muted text
#   #5b595c sel-bg  — separator
#   #403e41 black0  — inactive pane border
#   #2d2a2e bg      — used as fg on purple background (active window pill)
set -g status-position bottom
set -g status-justify  left
set -g status-style    "bg=default,fg=#939293"

set -g status-left-length  40
set -g status-left  "#[fg=#ab9df2,bold] #S #[default]"

set -g status-right-length 80
set -g status-right "#[fg=#939293]#h #[fg=#5b595c]│#[fg=#939293] %a %d %b %H:%M "

# Rounded pill tabs — half-circle caps (Nerd Font U+E0B6 / U+E0B4). Inactive
# pill: Monokai black0 (#403e41); active: Monokai purple (#ab9df2); bell
# turns the pill Monokai red (#ff6188). Caps drawn fg-on-default to blend.
setw -g window-status-style         "fg=#939293,bg=#403e41"
setw -g window-status-current-style "fg=#2d2a2e,bg=#ab9df2,bold"
setw -g window-status-format         "#[fg=#{?window_bell_flag,#ff6188,#403e41},bg=default]#[fg=#{?window_bell_flag,#2d2a2e,#939293},bg=#{?window_bell_flag,#ff6188,#403e41},#{?window_bell_flag,bold,nobold}] #I·#{=15:#{?pane_title,#{pane_title},#W}}#F #[fg=#{?window_bell_flag,#ff6188,#403e41},bg=default]"
setw -g window-status-current-format "#[fg=#ab9df2,bg=default]#[fg=#2d2a2e,bg=#ab9df2,bold] #I·#{=15:#{?pane_title,#{pane_title},#W}}#F #[fg=#ab9df2,bg=default]"
setw -g window-status-separator " "

set -g pane-border-style        "fg=#403e41"
set -g pane-active-border-style "#{?pane_in_mode,fg=#ffd866,#{?synchronize-panes,fg=#ff6188,fg=#ab9df2}}"

set -g message-style "fg=#2d2a2e,bg=#ab9df2,bold"
set -g message-command-style "fg=#2d2a2e,bg=#ffd866,bold"

# Copy-mode / search highlight — Monokai yellow on dark
setw -g mode-style "fg=#2d2a2e,bg=#ffd866,bold"

# Activity in inactive windows — subtle orange
setw -g window-status-activity-style "fg=#fc9867,bg=default"
setw -g window-status-bell-style     "fg=#ff6188,bg=default,bold"

# ── Plugins (TPM) ─────────────────────────────────────────────────────────────
# Plugin manager. Manage with: prefix I install · prefix U update · prefix M-u remove.
# Plugins live in ~/.tmux/plugins/. The `run` line at the very bottom must stay last.
set -g @plugin 'tmux-plugins/tpm'

# vim-tmux-navigator — vim-aware pane nav: one keystroke crosses between nvim
# splits AND tmux panes (it checks whether the focused pane is running vim).
# Its default keys are C-h/j/k/l, but those clobber shell line-editing at the
# prompt — C-k (kill-line), C-l (clear), C-h (backspace), C-j (enter) — so nav
# is moved onto the Alt keys instead (Option-as-Alt is enabled in kitty.conf).
# Result: M-h/j/k/l navigate everywhere; C-h/j/k/l stay free for the shell.
# These keys must match lua/plugins/vim-tmux-navigator.lua on the nvim side.
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @vim_navigator_mapping_left  'M-h'
set -g @vim_navigator_mapping_down  'M-j'
set -g @vim_navigator_mapping_up    'M-k'
set -g @vim_navigator_mapping_right 'M-l'
set -g @vim_navigator_mapping_prev  ''                  # disable C-\ (keep shell SIGQUIT)
set -g @vim_navigator_prefix_mapping_clear_screen ''    # not needed — plain C-l clears again

# extrakto — fzf-grab any token (path/URL/hash/word) from the visible pane +
# scrollback; Enter inserts it into the command line, or copies. Its default key
# is Tab, which is your `last-window`, so it's remapped to `prefix e` (extract).
set -g @plugin 'laktak/extrakto'
set -g @extrakto_key 'e'

# ── Session persistence / crash recovery (resurrect + continuum) ──────────────
# Why this exists: on this 16 GB box, running ~8 claude panes exhausted memory
# and the OS memory-killer took down the whole tmux SERVER — every pane and its
# claude process gone at once, with nothing saved to come back to. continuum
# snapshots the session to ~/.local/share/tmux/resurrect (XDG data dir) every
# few minutes; resurrect restores the window/pane layout, each pane's working
# dir + scrollback, and re-runs claude with its original arguments.
#
# Restore is MANUAL on purpose: `@continuum-restore off` means a fresh `tmux`
# comes up EMPTY, and you bring the session back deliberately with `prefix C-r`.
# Auto-restore would relaunch all 8 claudes the instant tmux starts and just
# re-trigger the same OOM. Saving is always automatic; only restore is on you.
#   Save now:  prefix C-s      Restore:  prefix C-r
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

set -g @resurrect-capture-pane-contents 'on'   # snapshot each pane's scrollback
set -g @resurrect-processes '"~claude"'         # restore claude with its full argv
set -g @continuum-save-interval '5'             # auto-snapshot every 5 minutes
set -g @continuum-restore 'off'                 # manual restore only — see note above

# Keep TPM's run line LAST.
run '~/.tmux/plugins/tpm/tpm'
