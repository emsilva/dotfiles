# ---------- Global ----------
palette = "monokai_default"
add_newline = true
command_timeout = 1200

# Left prompt (main info)
format = """
$os$hostname$directory$git_branch$git_status$git_state$package$nodejs$python$rust$golang$java$docker_context$kubernetes$cmd_duration$line_break$character
"""

# Right prompt (zsh/fish). Bash will ignore this.
right_format = """$time$battery"""

# ---------- Palette (Monokai Pro · Default) ----------
# Color names kept (mauve/peach/etc.) so existing module references work;
# values remapped to Monokai Pro Default equivalents.
[palettes.monokai_default]
rosewater = "#fcfcfa"
flamingo  = "#ff6188"
pink      = "#ff6188"
mauve     = "#ab9df2"
red       = "#ff6188"
maroon    = "#ff6188"
peach     = "#fc9867"
yellow    = "#ffd866"
green     = "#a9dc76"
teal      = "#78dce8"
sky       = "#78dce8"
sapphire  = "#78dce8"
blue      = "#78dce8"   # Monokai has no blue — using cyan
lavender  = "#ab9df2"
text      = "#fcfcfa"
subtext1  = "#c1c0c0"
subtext0  = "#939293"
overlay2  = "#727072"
overlay1  = "#5b595c"
overlay0  = "#5b595c"
surface2  = "#5b595c"
surface1  = "#403e41"
surface0  = "#221f22"
base      = "#2d2a2e"
mantle    = "#221f22"
crust     = "#19181a"

# ---------- Modules ----------
[os]
disabled = false
format = "[$symbol]($style)"
style = "text" # near-white foreground (was overlay1/muted-gray) so the macOS Apple logo reads white
[os.symbols]
Macos = " " # nf-linux-apple (U+F302) monochrome Apple logo (larger than fa-apple), replaces Starship default apple emoji
Ubuntu = " " # Ubuntu Nerd Font icon
Fedora = " " # Nerd Font
Arch = "󰣇 "
Debian = " "

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "overlay1"

[directory]
style = "blue bold"
read_only = " "
truncation_length = 3
truncation_symbol = "…/"
truncate_to_repo = false
fish_style_pwd_dir_length = 2

[git_branch]
symbol = " "
style = "mauve"
format = "[$symbol$branch]($style) "

[git_status]
style = "peach bold"
format = "[$all_status$ahead_behind]($style) "
conflicted = "✖"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
stashed = "⧉"
modified = "✚"
staged = "●"
renamed = "»"
deleted = ""
untracked = "…"

[git_state]
format = "[($state( $progress_current/$progress_total))]($style) "
style = "yellow"

[cmd_duration]
min_time = 500
style = "overlay2"
format = "[⏱ $duration]($style) "

[package]
symbol = "📦 "
style = "yellow"
format = "[$symbol$version]($style) "

[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "sky"
pyenv_version_name = true

[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "peach"

[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "teal"

[java]
symbol = " "
format = "[$symbol$version]($style) "
style = "maroon"

[docker_context]
only_with_files = true
symbol = "🐳 "
format = "[$symbol$context]($style) "
style = "sapphire"

[kubernetes]
disabled = false
detect_files = ["k8s", "Chart.yaml", "values.yaml"]
format = "[☸ $context(::$namespace)]($style) "
style = "lavender"

[container]
format = "[⬢ $name]($style) "
style = "sapphire"
disabled = false

[time]
disabled = false
time_format = "%H:%M"
format = "[$time]($style) "
style = "subtext1"

[battery]
disabled = false
full_symbol = " "
charging_symbol = " "
discharging_symbol = " "
unknown_symbol = " "
format = "[$symbol$percentage]($style)"
[[battery.display]]
threshold = 20
style = "red bold"
[[battery.display]]
threshold = 50
style = "yellow"
[[battery.display]]
threshold = 101
style = "green"

[character]
success_symbol = "[❯](green)"
error_symbol = "[❯](red)"
vimcmd_symbol = "[❮](peach)"
