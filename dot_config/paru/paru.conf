[options]
# Show repo packages before AUR in search results
BottomUp

# Don’t ask for your password over and over in one run
SudoLoop

# Automatically remove build dirs after successful build
CleanAfter

# Show Arch news when doing a full upgrade
NewsOnUpgrade

# When upgrading, show a combined list of repo + AUR updates
CombinedUpgrade

# Optional: enable this if you use a lot of -git / -devel packages
# Devel

# Optional: limit search results a bit (tune to taste)
Limit = 50

[bin]
Sudo = sudo

