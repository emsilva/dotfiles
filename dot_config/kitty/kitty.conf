# vim:fileencoding=utf-8:foldmethod=marker
include ./theme.conf

# Fonts {{{
font_family      family="CaskaydiaCove Nerd Font Mono"
bold_font        auto
italic_font      auto
bold_italic_font auto
disable_ligatures never
font_features CaskaydiaCoveNFM-Regular +calt +liga
font_features CaskaydiaCoveNFM-SemiBold +calt +liga
font_features CaskaydiaCoveNFM-Italic +calt +liga
font_features CaskaydiaCoveNFM-SemiBoldItalic +calt +liga

# Render icon/logo glyphs from the NON-Mono CaskaydiaCove Nerd Font so they draw
# full-size instead of being shrunk to one cell by the Mono text font. Covers the
# Nerd Font PUA ranges the shell prompt uses; powerline separators (U+E0B0-E0D7)
# are intentionally excluded so they stay exactly cell-width.
symbol_map U+E0A0-U+E0A3,U+E200-U+E2A9,U+E300-U+E3E3,U+E5FA-U+E6B7,U+E700-U+E8EF,U+EA60-U+EC1E,U+ED00-U+EFCE,U+F000-U+F2FF,U+F300-U+F381,U+F400-U+F533,U+F0001-U+F1AF0 CaskaydiaCove Nerd Font

font_size 14.0

modify_font cell_height 110%
modify_font cell_width  100%
# }}}

# Window {{{
window_padding_width 10
hide_window_decorations no
background_opacity 1.0
dynamic_background_opacity yes
# }}}

# Keyboard / input {{{
# macOS treats Option as a "compose special characters" key by default, so the
# terminal never emits ⌥-combos as Alt/Meta — ⌥⇧H inserts a glyph (Ó, ˙, …)
# instead of reaching tmux, which is why M-H/J/K/L misbehave here but are fine
# on Linux. `yes` makes BOTH Option keys real Alt/Meta, so M-h/j/k/l nav and
# M-H/J/K/L resize work identically to Arch. Use `left` instead if you'd rather
# keep the right Option key for typing accents/special characters.
macos_option_as_alt yes
# }}}

# Scrollback {{{
scrollback_lines 10000
scrollbar scrolled
scrollbar_interactive yes
scrollbar_jump_on_click yes
# }}}

# URL + mouse {{{
detect_urls yes
underline_hyperlinks hover
open_url_with default
# }}}

# Clipboard / paste {{{
paste_actions quote-urls-at-prompt,replace-dangerous-control-codes,confirm-if-large,confirm
strip_trailing_spaces smart
# }}}

# Safety {{{
confirm_os_window_close -1
# }}}

# Bell {{{
# Mute the audible BEL — tmux's window switching surfaces \a chars that some
# prompts/programs leave behind, and the resulting beep is just noise.
# Keep the visual bell (border flash) so we don't lose the signal entirely.
enable_audio_bell  no
visual_bell_duration 0.1
window_alert_on_bell yes
# }}}

# Remote control {{{
# ${HOME} is set on both macOS and Linux, so this one line works everywhere.
# (macOS has no $XDG_RUNTIME_DIR, which collapses to an unwritable /kitty path.)
allow_remote_control socket-only
listen_on unix:${HOME}/.kitty.sock
# }}}
